<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff4a36"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Route track path -->
  <path d="M 120 380 C 150 260, 220 280, 260 210 C 300 140, 360 170, 400 110" 
        fill="none" stroke="url(#neon)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Waypoint dots -->
  <circle cx="120" cy="380" r="16" fill="#c8ff00" />
  <circle cx="260" cy="210" r="12" fill="#00f0ff" />
  <circle cx="400" cy="110" r="20" fill="#ff4a36" filter="url(#glow)" />
  <circle cx="400" cy="110" r="8" fill="#ffffff" />
  <!-- Speed lines -->
  <path d="M 100 420 L 220 420" stroke="#c8ff00" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 130 445 L 190 445" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>
